name: FinBrief Prices Refresh

# Runs every 10 min during NSE market hours (Mon-Fri 9:15am-3:30pm IST = 3:45-10:00 UTC)
# Refreshes prices only — keeps sparklines & impact metrics current.
on:
  schedule:
    - cron: "*/10 3-9 * * 1-5"
    - cron: "0,5,10,15,20,25,30 9 * * 1-5"     # cover 9:30 finish + extras
  workflow_dispatch:

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  refresh-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          DATABASE_URL:   ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py --prices-only
